<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<title>边做边学 · 实验室资源平台</title>
<style>
:root { --navy:#1d2736; --orange:#bf512f; --muted:#596675; --line:#dde3ea; --light:#fff0eb; color:#17202c; background:#f5f6f8; font:14px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
* { box-sizing:border-box; } body { margin:0; } button,input,select,textarea { font:inherit; } button { cursor:pointer; } button:disabled { cursor:default; opacity:.55; } [hidden] { display:none !important; }
button { min-height:42px; padding:8px 13px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--navy); font-weight:600; }
button:hover:not(:disabled) { background:#f0f3f7; } .primary { color:white; background:var(--orange); border-color:var(--orange); } .primary:hover:not(:disabled) { background:#a94327; }
:focus-visible { outline:3px solid var(--orange); outline-offset:3px; } h1,h2,h3,p { margin:0; } h1 { font-size:26px; line-height:1.3; } h2 { font-size:20px; line-height:1.4; } h3 { font-size:16px; } small,.muted { color:var(--muted); } small { font-size:12px; } .eyebrow { font-size:12px; color:var(--orange); font-weight:700; letter-spacing:.08em; }
.toolbar { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding:12px 20px; background:var(--navy); color:white; }
.toolbar small { color:#d1dae6; } .badge { display:inline-block; padding:3px 9px; border-radius:5px; background:#fff0eb; color:#943917; font-weight:700; font-size:12px; } .toolbar .links { display:flex; gap:6px; } .toolbar button { min-height:36px; padding:5px 10px; background:transparent; border-color:#5d6a7c; color:white; font-size:12px; } .toolbar button:hover { background:#334052; }
main { padding:24px; max-width:1240px; margin:auto; } .intro { display:flex; justify-content:space-between; align-items:start; gap:16px; margin-bottom:22px; } .intro p { margin-top:8px; color:var(--muted); max-width:640px; } .role-chip { flex:none; border:1px solid var(--line); border-radius:30px; padding:6px 12px; background:white; font-size:12px; }
.catalog { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } .lesson { background:white; border:1px solid var(--line); border-radius:10px; padding:20px; display:flex; flex-direction:column; gap:10px; } .lesson p { color:var(--muted); flex:1; } .lesson header { display:flex; gap:10px; align-items:baseline; } .lesson-number { color:var(--orange); font-weight:700; font-size:12px; } .lesson-actions,.controls { display:flex; flex-wrap:wrap; gap:8px; } .lesson-actions button { flex:1; white-space:nowrap; } .catalog-note { margin-top:18px; color:var(--muted); font-size:12px; }
.done { text-align:center; max-width:630px; margin:25px auto; background:#fff; border:1px solid var(--line); border-radius:12px; padding:32px; } .done h1 { margin:12px 0; } .done ul { text-align:left; color:var(--muted); padding-left:20px; margin:20px 0; } .done .controls { justify-content:center; } .success-icon { display:inline-grid; place-items:center; width:50px; height:50px; border-radius:50%; background:#eaf8f2; color:#1c7a56; font-size:26px; }
.demo-target { box-shadow:0 0 0 7px #bf512f24; } .field-error { border-color:#b54145; } .scene dl { display:grid; grid-template-columns:80px 1fr; gap:8px; margin:0 0 16px; font-size:12px; } .scene dt { color:var(--muted); } .scene dd { margin:0; overflow-wrap:anywhere; }
body.in-lesson { overflow:hidden; }
body.in-lesson main { padding:0; max-width:none; }
.practice-topline { height:44px; display:flex; gap:12px; align-items:center; padding:0 16px; background:#fff; border-bottom:1px solid var(--line); font-size:12px; }
.practice-topline button { margin-left:auto; min-height:32px; padding:4px 12px; font-size:12px; }
#production-practice-frame { display:block; width:100%; height:calc(100dvh - 104px); border:0; background:#f5f6f8; }
#production-practice-frame[hidden] { display:none; }
#practice-loading { padding:30px; }
.practice-coach { position:fixed; bottom:16px; right:18px; width:310px; max-height:calc(100dvh - 130px); overflow:auto; border:1px solid #b75634; border-radius:10px; background:#fffaf7; box-shadow:0 12px 38px #17202c33; z-index:10; }
.practice-coach.coach-left { left:12px; right:auto; }
.coach-toggle { display:flex; justify-content:space-between; gap:14px; width:100%; text-align:left; border:0; border-radius:9px; color:#943917; background:#fff0eb; font-size:13px; }
.coach-body { padding:12px 14px; } .coach-body p { margin-bottom:10px; }
.coach-body details { font-size:12px; } .coach-body summary { cursor:pointer; color:#943917; font-weight:700; }
.coach-body dl { display:grid; grid-template-columns:95px minmax(0,1fr); gap:5px; overflow-wrap:anywhere; } .coach-body dd { margin:0; }
.coach-controls { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 8px; }
.coach-controls button { min-height:34px; padding:5px 10px; font-size:12px; }
.practice-coach.collapsed .coach-body { display:none; }
#feedback { color:#a32629; font-size:12px; font-weight:600; }
@media(max-width:560px) {
  main { padding:16px 12px; } .toolbar { padding:8px 10px; min-height:88px; } h1 { font-size:22px; }
  .intro { flex-direction:column; gap:10px; } .catalog { grid-template-columns:1fr; } .lesson { padding:16px; }
  .done { padding:22px 16px; } .practice-topline { padding:0 10px; }
  #production-practice-frame { height:calc(100dvh - 178px); }
  .practice-coach,.practice-coach.coach-left { width:calc(100% - 20px); left:10px; right:10px; bottom:6px; max-height:55dvh; }
}
@media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; animation:none !important; transition:none !important; } }
</style>
</head>
<body data-role="member">
<header class="toolbar"><div><span class="badge">演示模式</span> <small>仅虚拟数据 · 不影响真实业务</small></div><div class="links"><button type="button" id="text-guide">文字指南</button><button type="button" id="exit">退出演示</button></div></header>
<main id="classroom"></main>
<script src="./tutorial-api.js?v=1.4.14"></script>
<script src="./app.js?v=1.4.14"></script>
<script src="./tutorial.js?v=1.4.14"></script>
</body>
</html>
