name: cipc-labequip

services:
  web:
    image: nginx:1.27-alpine
    container_name: cipc-labequip-web
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./current/apps/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8020/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
